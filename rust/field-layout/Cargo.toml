[package]
name = "field-layout"
version = "0.1.0"
edition = "2021"
description = "The Semantic Field force simulation, compiled to WebAssembly."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
