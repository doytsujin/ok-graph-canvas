<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic Field Canvas</title>
    <meta
      name="description"
      content="A domain-neutral renderer for observable, policy-aware systems. Semantic links, projections over one field, explicit uncertainty, explicit causality, refusal as a state."
    />
    <script>
      // Applied before first paint, or the page flashes light and then corrects
      // itself. "System" is the ABSENCE of a stored value, never the word
      // "system": someone who picks it and later changes their OS setting
      // should follow the OS, and storing a resolved value freezes them.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
